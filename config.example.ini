; ============================================================
;  メール見張り番 の設定ファイル
;  文字コードは UTF-8 のまま保存してください(メモ帳なら「UTF-8」で保存)
;  一覧は1行に1つずつ書きます。# で始まる行はメモ(無視されます)
; ============================================================

[Gmail]
アドレス = あなたのアドレス@gmail.com
; Googleアカウントで発行した16桁のアプリパスワード(スペースはあってもなくても可)
アプリパスワード = ここに16桁のアプリパスワード

[チェック]
; 何分おきにチェックするか
間隔_分 = 60
; チェックする時間帯(開始時刻 〜 終了時刻の前まで)
開始時刻 = 8
終了時刻 = 21
; チェックする曜日(書いた曜日だけチェック。日曜休みなら「月火水木金土」)
チェックする曜日 = 月火水木金土
; 初めて起動したときに、何時間前までのメールをさかのぼって見るか
初回にさかのぼる時間 = 3
; 通知のときに音を鳴らすか (yes / no)
音を鳴らす = yes

[要対応の差出人]
; 差出人の名前やアドレスに、この文字が含まれていれば「仕事関係」とみなす
